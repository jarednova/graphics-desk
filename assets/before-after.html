<!doctype html>

<head>

<title>Before/after figure</title>
<!-- Source for before-after-light.png and before-after-dark.png. Render each at
     1200x910, 2x, with headless Chrome: this file for light, #dark for dark.
     The marks are drawn in the light palette; the rules below swap each color
     for its dark-mode token, keyed on the attribute value. -->
<style>
  html, body { margin: 0; padding: 0; }
  svg { display: block; width: 1200px; height: auto; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

  :root {
    --page: #FFFFFF; --ink: #1C1F38; --muted: #6F7180; --rule: #D0D7DE; --track: #E1E4E8;
    --money: #308160; --goal: #6956A0; --blue: #5866E3; --hatch: #FFFFFF;
  }
  :root.dark {
    --page: #0D1117; --ink: #E6EDF3; --muted: #9198A1; --rule: #3D444D; --track: #2A2F36;
    --money: #5FB383; --goal: #B6A8C5; --blue: #7C86F0; --hatch: #0D1117;
  }
  body { background: var(--page); }
  [fill="#f3f0ea"] { fill: var(--page); }        [stroke="#f3f0ea"] { stroke: var(--page); }
  [fill="#1a1f2e"] { fill: var(--ink); }
  [fill="#646a75"] { fill: var(--muted); }
  [stroke="#e6e2dc"], [stroke="#b8b3ab"], [stroke="#ddd9d3"] { stroke: var(--rule); }
  circle[stroke="#e6e2dc"] { stroke: var(--track); }
  [fill="#e6e2dc"] { fill: var(--track); }
  [fill="#308160"] { fill: var(--money); }       [stroke="#308160"] { stroke: var(--money); }
  [stroke="#6956A0"] { stroke: var(--goal); }
  [stroke="#5866E3"] { stroke: var(--blue); }
  [stroke="#fff"] { stroke: var(--hatch); }
</style>
<script>if (location.hash === '#dark') document.documentElement.classList.add('dark');</script>
</head>
